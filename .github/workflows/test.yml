name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # `npm ci` (not `install`): installs exactly what the lock file
      # pins, so the tree that is measured is the tree that ships.
      - run: npm ci
      - run: npm test
