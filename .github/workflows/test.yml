name: test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
      # `npm ci` (not `install`): installs exactly what the lock file
      # pins, so the tree that is measured is the tree that ships.
      - run: npm ci
      - run: npm test
