name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # `npm ci` (install DEGIL): kilit dosyasina birebir uyar, yani
      # olculen agac yayinlanacak agactir.
      - run: npm ci
      - run: npm test
